<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
	<!-- TibReader app icon: an archive box on Fluent blue. Render to icon.png with: npm run icon -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2b88d8"/>
			<stop offset="1" stop-color="#0f548c"/>
		</linearGradient>
		<linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#e6f0fa"/>
		</linearGradient>
	</defs>
	<rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
	<!-- Box body -->
	<rect x="62" y="110" width="132" height="94" rx="14" fill="#ffffff"/>
	<!-- Lid -->
	<rect x="48" y="66" width="160" height="44" rx="12" fill="url(#lid)"/>
	<!-- Handle slot -->
	<rect x="102" y="132" width="52" height="14" rx="7" fill="#0f6cbd"/>
</svg>
