# Packaging (see doc/Plan-desktop-app.md):
#   Windows: an installer, a single portable .exe and a zip
#   macOS:   .dmg and .zip for Intel and Apple Silicon (not signed: right-click > Open the first time)
#   Linux:   AppImage and .tar.gz
# Build on each OS with: npm run dist   (fetches the matching rclone first)
appId: io.github.prasadvagdargi.tibreader
productName: TibReader
copyright: Copyright © 2026 prasadvagdargi. MIT license.

directories:
  output: release
  buildResources: build

# The built app; the library's own dependencies (adler-32, xml2js) come from "dependencies"
files:
  - out/**/*
  - package.json
  - "!**/*.map"

# rclone (MIT) ships next to the app, outside the asar archive, so it can run
extraResources:
  - from: vendor/rclone/${os}-${arch}
    to: rclone
    filter:
      - rclone.exe
      - rclone
      - LICENSE.txt
  - from: ../LICENSE
    to: LICENSE.txt

asar: true

win:
  icon: build/icon.png
  # The zip's name (the installer and portable exe set their own below)
  artifactName: TibReader-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  # No Apple developer certificate: build unsigned instead of failing
  identity: null
  artifactName: TibReader-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

linux:
  icon: build/icon.png
  category: Utility
  synopsis: Read and restore Acronis True Image backups
  artifactName: TibReader-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]

# Double-clicking a .tib opens it in TibReader (Windows installer, macOS, Linux desktop entry)
fileAssociations:
  - ext: tib
    name: AcronisTrueImageBackup
    description: Acronis True Image backup
    role: Viewer
  - ext: tibx
    name: AcronisTrueImageBackupX
    description: Acronis True Image backup (2020 and later)
    role: Viewer

nsis:
  artifactName: TibReader-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: TibReader
  deleteAppDataOnUninstall: false

portable:
  artifactName: TibReader-${version}-portable.${ext}
  # Unpacks to the same temp folder every time instead of a new one
  unpackDirName: TibReader
